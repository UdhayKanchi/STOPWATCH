<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Stopwatch ⏱️</title>

<style>
:root {
  --bg1: #05050f;
  --bg2: #0a0a2a;
  --card: rgba(20, 20, 50, 0.85);
  --neon-blue: #00eaff;
  --neon-pink: #ff4fd8;
  --neon-green: #00ff9d;
  --danger: #ff4d6a;
  --gray: #8899aa;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  background-size: 400% 400%;
  animation: bgMove 14s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: #e0e0ff;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  position: relative;
  background: var(--card);
  border-radius: 26px;
  padding: 2.6rem 2.2rem;
  width: 100%;
  max-width: 430px;
  backdrop-filter: blur(14px);
  box-shadow:
    0 0 30px rgba(0,234,255,0.4),
    0 0 90px rgba(255,79,216,0.25);
}

/* Neon border glow */
.container::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 28px;
  background: linear-gradient(
    120deg,
    var(--neon-blue),
    var(--neon-pink),
    var(--neon-blue)
  );
  filter: blur(20px);
  z-index: -1;
  animation: glowRotate 6s linear infinite;
}

@keyframes glowRotate {
  0% { hue-rotate(0deg); }
  100% { hue-rotate(360deg); }
}

h1 {
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 0.4rem;
  color: var(--neon-blue);
  text-shadow:
    0 0 10px var(--neon-blue),
    0 0 35px rgba(0,234,255,0.8);
}

.subtitle {
  text-align: center;
  font-size: 0.9rem;
  margin-bottom: 1.6rem;
  color: #aabaff;
  letter-spacing: 1px;
}

/* Display */
#display {
  font-size: 3.6rem;
  text-align: center;
  letter-spacing: 6px;
  padding: 20px 22px;
  margin-bottom: 2rem;
  border-radius: 18px;
  color: #ffffff;
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(0,234,255,0.25);
  text-shadow: 0 0 35px rgba(0,234,255,0.6);
  animation: pulse 1.8s ease-in-out infinite alternate;
}

@keyframes pulse {
  from {
    box-shadow: 0 0 18px rgba(0,234,255,0.4);
  }
  to {
    box-shadow: 0 0 45px rgba(0,234,255,0.9);
  }
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 1.8rem;
}

button {
  padding: 14px 0;
  font-size: 1.05rem;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
}

button:active {
  transform: scale(0.96);
}

button:hover {
  box-shadow: 0 0 18px currentColor;
  transform: translateY(-2px);
}

#startStopBtn {
  background: var(--neon-blue);
  color: #000;
}

#startStopBtn.running {
  background: var(--danger);
  color: white;
}

#lapBtn {
  background: var(--neon-green);
  color: #000;
  opacity: 0.6;
}

#lapBtn.active {
  opacity: 1;
}

#resetBtn {
  background: var(--gray);
  color: white;
}

.laps-container {
  max-height: 240px;
  overflow-y: auto;
  background: rgba(0,0,0,0.3);
  border-radius: 14px;
  padding: 1rem;
  border: 1px solid rgba(255,255,255,0.08);
}

.lap-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-family: "Courier New", monospace;
  color: #a0e0ff;
  text-shadow: 0 0 6px rgba(0,234,255,0.6);
}

.lap-item:last-child {
  border-bottom: none;
}

.lap-number {
  color: var(--neon-blue);
  font-weight: bold;
}

.footer {
  text-align: center;
  font-size: 0.75rem;
  margin-top: 1.3rem;
  color: #8899ff;
  opacity: 0.8;
}

/* Scrollbar */
.laps-container::-webkit-scrollbar {
  width: 6px;
}
.laps-container::-webkit-scrollbar-thumb {
  background: var(--neon-blue);
  border-radius: 4px;
}

@media (max-width: 420px) {
  #display {
    font-size: 3rem;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>STOPWATCH</h1>
  <p class="subtitle">Precision • Speed • Neon Time</p>

  <div id="display">00:00:00.00</div>

  <div class="controls">
    <button id="startStopBtn">Start</button>
    <button id="lapBtn" disabled>Lap</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="laps-container" id="laps"></div>

  <div class="footer">
    ⚡ Powered by JavaScript • Designed in Neon ⚡
  </div>
</div>

<script>
let startTime = 0;
let elapsedTime = 0;
let timerInterval = null;
let isRunning = false;
let lapCount = 0;

const display = document.getElementById("display");
const startStopBtn = document.getElementById("startStopBtn");
const lapBtn = document.getElementById("lapBtn");
const resetBtn = document.getElementById("resetBtn");
const lapsContainer = document.getElementById("laps");

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const milliseconds = Math.floor((ms % 1000) / 10);

  return (
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0") + "." +
    String(milliseconds).padStart(2, "0")
  );
}

function updateDisplay() {
  display.textContent = formatTime(elapsedTime);
}

function startTimer() {
  if (!isRunning) {
    startTime = Date.now() - elapsedTime;
    timerInterval = setInterval(() => {
      elapsedTime = Date.now() - startTime;
      updateDisplay();
    }, 10);

    isRunning = true;
    startStopBtn.textContent = "Stop";
    startStopBtn.classList.add("running");
    lapBtn.disabled = false;
    lapBtn.classList.add("active");
  }
}

function stopTimer() {
  if (isRunning) {
    clearInterval(timerInterval);
    isRunning = false;
    startStopBtn.textContent = "Start";
    startStopBtn.classList.remove("running");
  }
}

function resetTimer() {
  stopTimer();
  elapsedTime = 0;
  lapCount = 0;
  updateDisplay();
  lapsContainer.innerHTML = "";
  lapBtn.disabled = true;
  lapBtn.classList.remove("active");
}

function recordLap() {
  if (!isRunning) return;

  lapCount++;
  const lapElement = document.createElement("div");
  lapElement.className = "lap-item";
  lapElement.innerHTML = `
    <span class="lap-number">Lap ${lapCount}</span>
    <span>${formatTime(elapsedTime)}</span>
  `;
  lapsContainer.prepend(lapElement);
}

startStopBtn.addEventListener("click", () => {
  isRunning ? stopTimer() : startTimer();
});

resetBtn.addEventListener("click", resetTimer);
lapBtn.addEventListener("click", recordLap);

updateDisplay();
</script>

</body>
</html>
